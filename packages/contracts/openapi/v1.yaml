openapi: 3.1.0
info:
  title: VDaAgent API
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: Process health
  /readyz:
    get:
      operationId: readyz
      responses:
        '200':
          description: Readiness state (body may report not_ready)
  /v1/local/workspaces/{workspace_id}/conversations:
    post:
      operationId: localCreateConversation
      parameters:
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: In-memory local conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreated'
        '401':
          description: Synthetic principal header missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invalid or duplicate conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/local/conversations/{conversation_id}/messages:
    post:
      operationId: localSendMessage
      parameters:
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message and durable event committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAck'
        '401':
          description: Synthetic principal header missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invalid membership or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: localReadMessages
      parameters:
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: ACL-filtered messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '401':
          description: Synthetic principal header missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conversation or membership not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/local/conversations/{conversation_id}/events:
    get:
      operationId: localReadEvents
      parameters:
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ConversationId'
        - name: after_seq
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Durable cursor replay and high watermark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReplay'
        '401':
          description: Synthetic principal header missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conversation or membership not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/local/conversations/{conversation_id}/bot-turn:
    post:
      operationId: localRunBotTurn
      parameters:
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotTurnRequest'
      responses:
        '201':
          description: Bounded fake-provider bot turn result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotTurnResponse'
        '403':
          description: Actor or bot is not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Local demo is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    PrincipalId:
      name: X-Principal-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
  schemas:
    CreateConversationRequest:
      type: object
      additionalProperties: false
      required: [conversation_id, member_ids]
      properties:
        conversation_id: {type: string, minLength: 1, maxLength: 256}
        member_ids:
          type: array
          minItems: 1
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 256}
        bot_templates:
          type: object
          maxProperties: 16
          additionalProperties: {type: string, enum: [DataAssistant, DataSteward, DataAnalyst, ReportWriter]}
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [client_message_id, body]
      properties:
        client_message_id: {type: string, minLength: 1, maxLength: 256}
        body: {type: string, minLength: 1, maxLength: 12000}
    BotTurnRequest:
      type: object
      additionalProperties: false
      required: [bot_id, turn_id]
      properties:
        bot_id: {type: string, minLength: 1, maxLength: 256}
        turn_id: {type: string, minLength: 1, maxLength: 256}
    ConversationCreated:
      type: object
      additionalProperties: false
      required: [conversation_id, workspace_id]
      properties:
        conversation_id: {type: string, minLength: 1, maxLength: 256}
        workspace_id: {type: string, minLength: 1, maxLength: 256}
    MessageAck:
      type: object
      additionalProperties: false
      required: [message_id, sequence, bot_dispatch, event_id]
      properties:
        message_id: {type: string, minLength: 1, maxLength: 256}
        sequence: {type: integer, minimum: 1}
        bot_dispatch:
          type: object
          additionalProperties: {type: string}
        event_id: {type: string, minLength: 1, maxLength: 256}
    Message:
      type: object
      additionalProperties: false
      required: [message_id, sender_id, sequence, body]
      properties:
        message_id: {type: string, minLength: 1, maxLength: 256}
        sender_id: {type: string, minLength: 1, maxLength: 256}
        sequence: {type: integer, minimum: 1}
        body: {type: string}
    MessageList:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items: {$ref: '#/components/schemas/Message'}
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [event_id, event_sequence, event_type, payload]
      properties:
        event_id: {type: string, minLength: 1, maxLength: 256}
        event_sequence: {type: integer, minimum: 1}
        event_type: {type: string, minLength: 1, maxLength: 128}
        payload: {type: object, additionalProperties: false}
    EventReplay:
      type: object
      additionalProperties: false
      required: [high_watermark, events]
      properties:
        high_watermark: {type: integer, minimum: 0}
        events:
          type: array
          items: {$ref: '#/components/schemas/EventEnvelope'}
    BotTurnResponse:
      type: object
      additionalProperties: false
      required: [status, provider, model, error_code, message_id, sequence, text]
      properties:
        status: {type: string, enum: [ok, queued, needs_approval, needs_input, denied, failed]}
        provider: {type: string}
        model: {type: string}
        error_code: {type: [string, 'null']}
        message_id: {type: [string, 'null']}
        sequence: {type: [integer, 'null'], minimum: 1}
        text: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail: {type: string, minLength: 1, maxLength: 1000}
        code: {type: string, maxLength: 128}
        correlation_id: {type: string, maxLength: 256}
        retryable: {type: boolean}
