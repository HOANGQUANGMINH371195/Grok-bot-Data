name: r1-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.31'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: make bootstrap
      - name: Verify frozen implementation contract
        run: node scripts/verify-implement.mjs
      - name: Validate contracts
        run: make contracts-check
      - name: Lint and typecheck
        run: make lint && make typecheck
      - name: Offline unit and contract tests
        run: make test-unit && make test-contract
      - name: Build web shell
        run: corepack pnpm --filter @vda-agent/web build
